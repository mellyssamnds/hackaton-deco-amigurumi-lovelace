version: "3.8"

# Amigurumi Lovelace / Projeto Beatriz - nestjs-worker
# Este compose roda na VM Oracle Cloud (sem CI/CD), 24/7.
#
# ATENÇÃO (Parte 2 / Parte 3 compartilham esta pasta):
# `processing` (Parte 2: consumo da fila + preparo do WatermarkJob) e
# `watermark-email` (Parte 3: marca d'água + envio por e-mail) sobem juntos
# aqui. Os dois usam a mesma pasta `nestjs-worker/assets/ebooks` (montada
# somente-leitura em `watermark-email`) e não devem ser removidos/renomeados
# um pelo outro, para não quebrar o deploy da outra parte.

services:
  processing:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beatriz-processing
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  watermark-email:
    build:
      context: ../watermark-email
      dockerfile: Dockerfile
    container_name: beatriz-watermark-email
    restart: always
    env_file:
      - ../watermark-email/.env
    environment:
      - EBOOKS_DIR=/app/assets/ebooks
    ports:
      - "3001:3001"
    volumes:
      - ../assets/ebooks:/app/assets/ebooks:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
